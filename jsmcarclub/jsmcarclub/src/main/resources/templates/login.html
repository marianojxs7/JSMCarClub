
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | JSMCarClub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #151515;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 14px;
        }

        .brand {
            color: #b99525;
            font-size: 30px;
            font-weight: bold;
        }

        .btn-gold {
            background: #d4af37;
            color: #111;
            font-weight: bold;
            border: none;
        }

        .btn-gold:hover {
            background: #b99525;
        }
    </style>
</head>
<body>

<div class="login-card shadow-lg">

    <div class="text-center mb-4">
        <div class="brand">JSMCarClub</div>
        <h4 class="mt-3">Iniciar sesión</h4>
        <p class="text-secondary">Acceso al sistema administrativo</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Correo o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" name="correo" class="form-control"
                   placeholder="admin@jsmcarclub.com" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <input type="password" name="contrasena"
                   class="form-control" required>
        </div>

        <button type="submit" class="btn btn-gold w-100 py-2">
            Ingresar
        </button>

    </form>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="text-secondary text-decoration-none">
            Volver al sitio web
        </a>
    </div>

</div>

</body>
</html>
