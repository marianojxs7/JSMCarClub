
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de vehículo | JSMCarClub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f4f4; font-family: Arial, sans-serif; }
        .sidebar { background: #151515; min-height: 100vh; color: white; padding: 25px 15px; }
        .brand { color: #d4af37; font-weight: bold; font-size: 23px; }
        .sidebar a { display: block; color: #ddd; text-decoration: none; padding: 12px; margin-top: 8px; }
        .sidebar a:hover { color: #d4af37; }
        .content { padding: 35px; }
        .card { border: none; border-radius: 12px; }
        .btn-gold { background: #d4af37; color: #111; font-weight: bold; }
        .btn-gold:hover { background: #b99525; }
        label { font-weight: 600; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 sidebar">
            <div class="brand mb-4">JSMCarClub</div>
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/vehiculos}">Vehículos</a>
            <a th:href="@{/}">Ver sitio web</a>
        </aside>

        <main class="col-md-10 content">

            <div class="mb-4">
                <h2 class="fw-bold"
                    th:text="${vehiculo.id == null ? 'Registrar vehículo' : 'Editar vehículo'}">
                    Registrar vehículo
                </h2>
                <p class="text-secondary">Completa la información del vehículo.</p>
            </div>

            <div class="card shadow-sm p-4">

                <form th:action="@{/admin/vehiculos/guardar}" method="post"
                      th:object="${vehiculo}">

                    <input type="hidden" th:field="*{id}">

                    <h5 class="mb-3">Información general</h5>

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label>Placa</label>
                            <input type="text" class="form-control" th:field="*{placa}" required>
                        </div>

                        <div class="col-md-4">
                            <label>Marca</label>
                            <select name="marcaId" class="form-select" required>
                                <option value="">Seleccione una marca</option>
                                <option th:each="marca : ${marcas}"
                                        th:value="${marca.id}"
                                        th:text="${marca.nombre}"
                                        th:selected="${vehiculo.marca != null and vehiculo.marca.id == marca.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label>Modelo</label>
                            <input type="text" class="form-control" th:field="*{modelo}" required>
                        </div>

                        <div class="col-md-4">
                            <label>Año</label>
                            <input type="number" class="form-control" th:field="*{anio}" min="1900" required>
                        </div>

                        <div class="col-md-4">
                            <label>Tipo de vehículo</label>
                            <select name="tipoVehiculoId" class="form-select" required>
                                <option value="">Seleccione un tipo</option>
                                <option th:each="tipo : ${tipos}"
                                        th:value="${tipo.id}"
                                        th:text="${tipo.nombre}"
                                        th:selected="${vehiculo.tipoVehiculo != null and vehiculo.tipoVehiculo.id == tipo.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label>Kilometraje</label>
                            <input type="number" class="form-control" th:field="*{kilometraje}" min="0" required>
                        </div>

                        <div class="col-md-4">
                            <label>Precio (₡)</label>
                            <input type="number" class="form-control" th:field="*{precio}" min="0" step="0.01" required>
                        </div>

                        <div class="col-md-4">
                            <label>Combustible</label>
                            <select name="combustibleId" class="form-select" required>
                                <option value="">Seleccione combustible</option>
                                <option th:each="combustible : ${combustibles}"
                                        th:value="${combustible.id}"
                                        th:text="${combustible.nombre}"
                                        th:selected="${vehiculo.combustible != null and vehiculo.combustible.id == combustible.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label>Transmisión</label>
                            <select name="transmisionId" class="form-select" required>
                                <option value="">Seleccione transmisión</option>
                                <option th:each="transmision : ${transmisiones}"
                                        th:value="${transmision.id}"
                                        th:text="${transmision.nombre}"
                                        th:selected="${vehiculo.transmision != null and vehiculo.transmision.id == transmision.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-12">
                            <label>Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="4"></textarea>
                        </div>

                    </div>

                    <hr class="my-4">

                    <h5 class="mb-3">Información del propietario</h5>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label>Nombre del propietario</label>
                            <input type="text" class="form-control"
                                   th:field="*{nombrePropietario}" required>
                        </div>

                        <div class="col-md-6">
                            <label>Teléfono del propietario</label>
                            <input type="tel" class="form-control"
                                   th:field="*{telefonoPropietario}" required>
                        </div>

                        <div class="col-md-6">
                            <label>ID del colaborador que registra</label>
                            <input type="number" class="form-control" name="usuarioId"
                                   min="1" placeholder="ID del usuario administrador o colaborador" required>
                        </div>

                        <div class="col-md-6">
                            <label>Estado de publicación</label>
                            <select th:field="*{estado}" class="form-select">
                                <option value="DISPONIBLE">Disponible</option>
                                <option value="RESERVADO">Reservado</option>
                                <option value="VENDIDO">Vendido</option>
                            </select>
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-gold px-4">
                            Guardar vehículo
                        </button>

                        <a th:href="@{/admin/vehiculos}" class="btn btn-outline-secondary px-4">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
