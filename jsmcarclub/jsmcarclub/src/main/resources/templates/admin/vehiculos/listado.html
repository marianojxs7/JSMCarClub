
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de vehículos | JSMCarClub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background: #f4f4f4; font-family: Arial, sans-serif; }
        .sidebar { background: #151515; min-height: 100vh; color: white; padding: 25px 15px; }
        .brand { color: #d4af37; font-weight: bold; font-size: 23px; }
        .sidebar a { display: block; color: #ddd; text-decoration: none; padding: 12px; border-radius: 6px; margin-top: 8px; }
        .sidebar a:hover, .sidebar a.active { background: #333; color: #d4af37; }
        .content { padding: 35px; }
        .card { border: none; border-radius: 12px; }
        .btn-gold { background: #d4af37; color: #111; font-weight: bold; }
        .btn-gold:hover { background: #b99525; color: #111; }
        .table thead { background: #202020; color: white; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 sidebar">
            <div class="brand mb-4">JSMCarClub</div>

            <a th:href="@{/admin/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <a th:href="@{/admin/vehiculos}" class="active">
                <i class="bi bi-car-front"></i> Vehículos
            </a>

            <a th:href="@{/}">
                <i class="bi bi-house"></i> Ver sitio web
            </a>
        </aside>

        <main class="col-md-10 content">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h2 class="fw-bold">Gestión de vehículos</h2>
                    <p class="text-secondary">Administra las publicaciones de JSMCarClub.</p>
                </div>

                <a th:href="@{/admin/vehiculos/nuevo}" class="btn btn-gold">
                    <i class="bi bi-plus-circle"></i> Registrar vehículo
                </a>
            </div>

            <div class="card shadow-sm p-4">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Vehículo</th>
                                <th>Año</th>
                                <th>Precio</th>
                                <th>Estado</th>
                                <th>Publicación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="vehiculo : ${vehiculos}">
                                <td th:text="${vehiculo.placa}"></td>

                                <td>
                                    <strong th:text="${vehiculo.marca.nombre + ' ' + vehiculo.modelo}"></strong>
                                </td>

                                <td th:text="${vehiculo.anio}"></td>

                                <td th:text="${'₡' + #numbers.formatDecimal(vehiculo.precio, 1, 'COMMA', 2, 'POINT')}"></td>

                                <td>
                                    <span th:if="${vehiculo.activo}" class="badge bg-success">Activo</span>
                                    <span th:unless="${vehiculo.activo}" class="badge bg-secondary">Inactivo</span>
                                </td>

                                <td>
                                    <span th:if="${vehiculo.premium}" class="badge text-bg-warning">Premium</span>
                                    <span th:unless="${vehiculo.premium}" class="badge bg-light text-dark">Estándar</span>
                                </td>

                                <td>
                                    <a th:href="@{/admin/vehiculos/editar/{id}(id=${vehiculo.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <form th:action="@{/admin/vehiculos/eliminar/{id}(id=${vehiculo.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('¿Deseas eliminar este vehículo?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(vehiculos)}">
                                <td colspan="7" class="text-center text-secondary py-4">
                                    No hay vehículos registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
